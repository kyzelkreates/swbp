<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WellTrack — Student Welfare</title>

  <!-- PWA -->
  <link rel="manifest" href="/swp/pwa/student-manifest.json" />
  <meta name="theme-color" content="#2C7A7B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="WellTrack" />
  <meta name="description" content="Your personal student wellbeing dashboard — check in daily, set goals, and get the right support." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #F7FAFC; font-family: 'Inter', system-ui, sans-serif; }
    #pwa-mount { min-height: 100vh; }
    /* Splash loader */
    #pwa-splash {
      position: fixed; inset: 0; background: #2C7A7B;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s ease;
    }
    #pwa-splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo { font-size: 4rem; margin-bottom: 1rem; animation: bounce 1s ease infinite; }
    .splash-name { color: white; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; }
    .splash-sub  { color: rgba(255,255,255,0.7); font-size: 0.8rem; margin-top: 0.25rem; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  </style>
</head>
<body>

<!-- SPLASH -->
<div id="pwa-splash">
  <div class="splash-logo">💚</div>
  <div class="splash-name">WellTrack</div>
  <div class="splash-sub">Student Welfare</div>
</div>

<!-- MOUNT POINT -->
<div id="pwa-mount"></div>

<!-- SERVICE WORKER REGISTRATION -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("/swp/pwa/student-sw.js")
        .then(() => console.log("[WellTrack PWA] Service Worker registered"))
        .catch(err => console.warn("[WellTrack PWA] SW registration failed:", err));
    });
  }
</script>

<!-- STUDENT PWA INIT -->
<script type="module">
  import { initStudentPWA } from "./swp/pwa/student-pwa.js";

  window.addEventListener("DOMContentLoaded", () => {
    const mount = document.getElementById("pwa-mount");
    try {
      initStudentPWA(mount);
    } catch (err) {
      console.error("[WellTrack Student PWA] Init error:", err);
      mount.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;font-family:sans-serif;">
          <div style="font-size:2.5rem;margin-bottom:1rem;">⚠️</div>
          <div style="font-weight:700;font-size:1.1rem;margin-bottom:0.5rem;">Failed to load WellTrack</div>
          <div style="font-size:0.85rem;color:#718096;margin-bottom:1rem;">${err.message}</div>
          <button onclick="location.reload()" style="padding:0.6rem 1.25rem;background:#2C7A7B;color:white;border:none;border-radius:8px;cursor:pointer;font-size:0.875rem;">Try again</button>
        </div>
      `;
    }

    // Hide splash
    setTimeout(() => {
      const splash = document.getElementById("pwa-splash");
      if (splash) {
        splash.classList.add("hide");
        setTimeout(() => splash.remove(), 400);
      }
    }, 1200);
  });
</script>

</body>
</html>
