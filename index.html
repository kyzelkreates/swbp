<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WellTrack — Student Wellbeing Platform</title>
  <link rel="manifest" href="swp/pwa/swp-manifest.json" />
  <meta name="theme-color" content="#2C7A7B" />
  <meta name="description" content="Student wellbeing platform for schools — mood tracking, check-ins, alerts and pastoral support." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="swp/ui/swp-dashboard.css" />
  <style>
    /* Loading screen */
    #swp-loading {
      position: fixed; inset: 0;
      background: #F7FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #swp-loading.hide { opacity: 0; pointer-events: none; }
    .swp-loading__logo { font-size: 3rem; margin-bottom: 1rem; animation: pulse 1.5s ease-in-out infinite; }
    .swp-loading__text { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 700; color: #2C7A7B; margin-bottom: 0.375rem; }
    .swp-loading__sub  { font-family: 'Inter', sans-serif; font-size: 0.825rem; color: #718096; }
    .swp-loading__bar  { width: 220px; height: 4px; background: #E2E8F0; border-radius: 99px; margin-top: 1.5rem; overflow: hidden; }
    .swp-loading__fill { height: 100%; background: #2C7A7B; border-radius: 99px; animation: loadbar 1.8s ease forwards; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    @keyframes loadbar { 0%{width:0%} 100%{width:100%} }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="swp-loading">
  <div class="swp-loading__logo">💚</div>
  <div class="swp-loading__text">WellTrack</div>
  <div class="swp-loading__sub">Student Wellbeing Platform — Loading demo data…</div>
  <div class="swp-loading__bar"><div class="swp-loading__fill"></div></div>
</div>

<!-- APP MOUNT -->
<div id="swp-root"></div>

<script type="module">
  import { initSWP, loadModule } from './swp/ui/swp-dashboard.js';

  // Expose loadModule globally so inline onclick handlers work
  window.loadModule = loadModule;

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const root = document.getElementById('swp-root');
      initSWP(root);

      // Hide loading screen
      setTimeout(() => {
        const loading = document.getElementById('swp-loading');
        if (loading) {
          loading.classList.add('hide');
          setTimeout(() => loading.remove(), 400);
        }
      }, 1800);

      // Handle URL module param
      const params = new URLSearchParams(window.location.search);
      const moduleParam = params.get('module');
      if (moduleParam) {
        setTimeout(() => loadModule(moduleParam), 2000);
      }

    } catch (err) {
      console.error('[SWP] Init error:', err);
      document.getElementById('swp-loading').innerHTML = `
        <div style="font-family:sans-serif;text-align:center;padding:2rem;color:#E53E3E;">
          <div style="font-size:2rem;">⚠️</div>
          <div style="font-weight:700;margin-top:0.5rem;">Failed to load</div>
          <div style="font-size:0.85rem;color:#718096;margin-top:0.375rem;">${err.message}</div>
          <div style="margin-top:1rem;font-size:0.8rem;color:#718096;">Check console for details. This app requires a local server (not file://).</div>
        </div>
      `;
    }
  });
</script>

</body>
</html>
